<div class="himaia-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>himaia voice</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">

      <label class="checkbox_label" for="himaia-enabled">
        <input id="himaia-enabled" type="checkbox" />
        <span>Enable himaia voice for chat replies</span>
      </label>

      <label for="himaia-base-url">Base URL</label>
      <input id="himaia-base-url" type="text" class="text_pole" placeholder="https://api.himaia.dev" />

      <label for="himaia-api-key">API key</label>
      <div class="himaia-key-row">
        <input id="himaia-api-key" type="password" class="text_pole" placeholder="himaia_live_…" />
        <button id="himaia-key-toggle" class="menu_button" type="button" title="Show/hide">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>

      <button id="himaia-test-conn" class="menu_button" type="button">
        Test connection
      </button>
      <div id="himaia-status" class="himaia-status" role="status" aria-live="polite"></div>

      <hr />

      <label for="himaia-persona">Persona</label>
      <select id="himaia-persona" class="text_pole"></select>
      <small id="himaia-persona-tagline" class="himaia-faint"></small>

      <label for="himaia-scene-format">Scene · format</label>
      <select id="himaia-scene-format" class="text_pole"></select>

      <label for="himaia-scene-act">Scene · dialogue act</label>
      <select id="himaia-scene-act" class="text_pole"></select>

      <label for="himaia-voice">Voice</label>
      <select id="himaia-voice" class="text_pole">
        <option value="">— let persona pick —</option>
        <option value="ember">Ember (warm, grounded)</option>
        <option value="nova">Nova (bright, confident)</option>
        <option value="atlas">Atlas (deep, steady)</option>
        <option value="onyx">Onyx (low, serious)</option>
        <option value="marlow">Marlow (smoky, late-night)</option>
        <option value="dahlia">Dahlia (rich, dramatic)</option>
        <option value="archer">Archer (energetic, confident)</option>
        <option value="sage">Sage (calm, measured)</option>
      </select>

      <hr />

      <button id="himaia-stop-playback" class="menu_button" type="button">
        Stop playback
      </button>
      <div id="himaia-now-playing" class="himaia-now-playing" aria-live="polite"></div>

      <label class="checkbox_label" for="himaia-debug">
        <input id="himaia-debug" type="checkbox" />
        <span>Debug logging (DevTools console)</span>
      </label>

      <small class="himaia-faint">
        Auto-plays assistant replies when enabled. Stop button drops the queue.
        Debug logs include scene resolution, request shape, and response timings —
        message content is never logged.
      </small>
    </div>
  </div>
</div>

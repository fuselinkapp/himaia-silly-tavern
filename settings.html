<div class="maia-voice-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>Maia Voice</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">

      <label class="checkbox_label" for="maia-enabled">
        <input id="maia-enabled" type="checkbox" />
        <span>Enable Maia Voice for chat replies</span>
      </label>

      <label for="maia-base-url">Base URL</label>
      <input id="maia-base-url" type="text" class="text_pole" placeholder="https://api.maia.sh" />

      <label for="maia-api-key">API key</label>
      <div class="maia-key-row">
        <input id="maia-api-key" type="password" class="text_pole" placeholder="mvk_live_…" />
        <button id="maia-key-toggle" class="menu_button" type="button" title="Show/hide">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>

      <button id="maia-test-conn" class="menu_button" type="button">
        Test connection
      </button>
      <div id="maia-status" class="maia-status" role="status" aria-live="polite"></div>

      <hr />

      <label for="maia-persona">Persona</label>
      <select id="maia-persona" class="text_pole"></select>
      <small id="maia-persona-tagline" class="maia-faint"></small>

      <label for="maia-scene-format">Scene · format</label>
      <select id="maia-scene-format" class="text_pole"></select>

      <label for="maia-scene-act">Scene · dialogue act</label>
      <select id="maia-scene-act" class="text_pole"></select>

      <label for="maia-voice">Voice</label>
      <select id="maia-voice" class="text_pole">
        <option value="">— let persona pick —</option>
        <option value="ember">Ember (warm, grounded)</option>
        <option value="nova">Nova (bright, confident)</option>
        <option value="atlas">Atlas (deep, steady)</option>
        <option value="onyx">Onyx (low, serious)</option>
        <option value="marlow">Marlow (smoky, late-night)</option>
        <option value="dahlia">Dahlia (rich, dramatic)</option>
        <option value="archer">Archer (energetic, confident)</option>
        <option value="sage">Sage (calm, measured)</option>
      </select>

      <hr />

      <button id="maia-stop-playback" class="menu_button" type="button">
        Stop playback
      </button>
      <div id="maia-now-playing" class="maia-now-playing" aria-live="polite"></div>

      <label class="checkbox_label" for="maia-debug">
        <input id="maia-debug" type="checkbox" />
        <span>Debug logging (DevTools console)</span>
      </label>

      <small class="maia-faint">
        Auto-plays assistant replies when enabled. Stop button drops the queue.
        Debug logs include scene resolution, request shape, and response timings —
        message content is never logged.
      </small>
    </div>
  </div>
</div>
